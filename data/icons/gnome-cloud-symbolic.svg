<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#222222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cloud badge ("synced"), re-parameterised from the GNOME Icon Development
       Kit cloud, CC0: https://icons.design.gnome.org/

       The badge has to sit in the same header row as the app's own favorite
       heart, so this artwork is tuned to that contract rather than to the GNOME
       original:

         * stroke-width 1 at a 16 viewBox = a 1 px hairline at 16 px, which is
           the weight of an outline symbolic icon. The old stroke-width 2
           rendered at 2.25 px, twice that. One unit is this badge's floor, not
           a target to match the heart against: that heart's wall is 1.4 units
           (see photoviewer-heart-symbolic.svg for why a half-unit one is
           invisible at 18 px), and the two are tuned for legibility at the
           sizes they are drawn at rather than for equality.
         * the outline is built from two lobes tangent to the flat base
           (left r=2.5 at (4.3, 12.1), right r=5.0 at (9.2, 9.6), base y=14.6)
           so the ink spans 13.4 x 11.0 of the 16 unit box. The GNOME path left
           its ink at 14 x 9, mostly in the lower half, so at a 16 px box it drew
           a shorter, wider shape than the glyph beside it.
         * margins are 1.8 units, leaving room for the stroke's own half width.

       Keep the ink box this way: the viewer badge and the grid-tile badge
       share this artwork, and a silhouette that shrinks inside its box is what
       made the two icons look like different families. -->
  <path style="fill:none;stroke:#222222" d="M 4.300 14.600 A 2.500 2.500 0 1 1 4.200 9.602 A 5.000 5.000 0 1 1 9.200 14.600 Z"/>
</svg>
