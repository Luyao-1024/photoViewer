<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#222222" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cloud badge ("not synced"): the same silhouette as gnome-cloud-symbolic.svg
       plus a diagonal, CC0: https://icons.design.gnome.org/

       The diagonal stays inside the cloud's own ink box on purpose. It used to
       run corner to corner (2,2 -> 14,14), which pushed this state's ink out to
       the full 16 unit box, so switching sync state resized the badge. State
       changes must not move the glyph. -->
  <path style="fill:none;stroke:#222222" d="M 4.300 14.600 A 2.500 2.500 0 1 1 4.200 9.602 A 5.000 5.000 0 1 1 9.200 14.600 Z"/>
  <path style="fill:none;stroke:#222222" d="M 3.175 12.725 L 12.450 7.100"/>
</svg>
